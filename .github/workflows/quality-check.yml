name: quality-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/quality-check.yml"
      - "apps/**"
      - "package.json"
      - "packages/**"
      - "playwright.config.*"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "services/**"
      - "tests/**"
      - "tools/**"
      - "tsconfig*.json"
      - "vitest.config.*"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/quality-check.yml"
      - "apps/**"
      - "package.json"
      - "packages/**"
      - "playwright.config.*"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "services/**"
      - "tests/**"
      - "tools/**"
      - "tsconfig*.json"
      - "vitest.config.*"

permissions:
  contents: read

concurrency:
  group: supaluv-quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify code
        run: pnpm verify

      - name: Verify generators left the checkout clean (tracked and untracked)
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Verify governed assets
        run: pnpm assets:check

      - run: git diff --check

  release-evidence:
    name: manual release evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full cloud-independent checks
        run: pnpm cloud:check

      - name: Verify generators left the checkout clean (tracked and untracked)
        run: test -z "$(git status --porcelain --untracked-files=all)"

      - name: Prepare non-secret Vercel build metadata
        run: |
          mkdir -p .vercel
          cp tools/vercel-project-ci.json .vercel/project.json

      - name: Build Vercel output without deploying
        run: pnpm build:vercel

      - name: Verify Vercel output
        run: pnpm verify:vercel-output

      - name: Run browser E2E
        run: pnpm test:e2e

      - run: git diff --check

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: supaluv-release-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3
