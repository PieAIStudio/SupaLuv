name: quality-check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm cloud:check
      - name: Prepare non-secret Vercel build metadata
        run: |
          mkdir -p .vercel
          node -e 'require("node:fs").writeFileSync(".vercel/project.json", JSON.stringify({ projectId: "prj_FyzCfVF0HRsFPTNYxg05OpQWDyeU", orgId: "team_C63r8BVtFCpiOK1k2h7xytT9", projectName: "supaluv" }))'
      - run: pnpm build:vercel
      - run: pnpm verify:vercel-output
      - run: pnpm test:e2e
      - run: git diff --check
