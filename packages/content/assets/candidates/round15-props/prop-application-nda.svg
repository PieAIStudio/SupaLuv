    <text x="375" y="145" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#5f6264">NON-DISCLOSURE COMMITMENT</text>
