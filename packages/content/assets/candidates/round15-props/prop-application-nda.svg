    <text x="118" y="681" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="29" font-weight="800" fill="#1b2022">￥ [隐去]</text>
    <text x="628" y="688" text-anchor="end" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="62" font-weight="900" letter-spacing="10" fill="#8c2929">00000</text>
    <text x="375" y="735" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="23" font-weight="700" fill="#8c2929">后面五个零</text>
