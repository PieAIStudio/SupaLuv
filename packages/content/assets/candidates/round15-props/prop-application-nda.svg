    <rect x="55" y="209" width="474" height="58" rx="8" fill="#18342d"/>
    <text x="75" y="247" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="800" fill="#e7f6ef">补贴五倍</text>
    <text x="504" y="247" text-anchor="end" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" fill="#bfe0d1">全天候体验官</text>

