    <rect x="74" y="390" width="602" height="160" fill="#171b1e"/>
    <text x="104" y="431" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="900" letter-spacing="3" fill="#d9a8a4">第七条</text>
    <text x="104" y="476" font-family="Songti SC, SimSun, serif" font-size="28" font-weight="900" fill="#ffffff">设备之存在，不得让任何非签约人知晓，</text>
    <text x="104" y="518" font-family="Songti SC, SimSun, serif" font-size="28" font-weight="900" fill="#ffffff">包括同住人。</text>

    <text x="92" y="607" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#5f6264">违约金</text>
