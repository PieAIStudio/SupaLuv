  <text x="88" y="858" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" letter-spacing="2" fill="#ffffff" opacity="0.38">PROP / APPLICATION + NDA / CANDIDATE</text>
