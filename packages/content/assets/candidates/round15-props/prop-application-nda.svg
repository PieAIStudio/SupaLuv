    <text x="92" y="255" font-family="Songti SC, SimSun, serif" font-size="23" font-weight="700" fill="#15191c">签约条件：独立房间 / 超级保密协议</text>
    <g opacity="0.25" fill="#1a1d1f">
      <rect x="92" y="284" width="568" height="7" rx="3"/><rect x="92" y="306" width="520" height="7" rx="3"/>
      <rect x="92" y="328" width="584" height="7" rx="3"/><rect x="92" y="350" width="548" height="7" rx="3"/>
