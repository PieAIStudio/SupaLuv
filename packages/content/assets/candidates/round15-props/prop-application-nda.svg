    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d3027"/>
      <stop offset="0.48" stop-color="#181416"/>
      <stop offset="1" stop-color="#111b22"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eff3f2"/>
      <stop offset="1" stop-color="#d8dddb"/>
