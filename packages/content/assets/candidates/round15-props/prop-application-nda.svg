  <rect x="100" y="70" width="1400" height="748" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-dasharray="8 12"/>

  <g transform="translate(116 84)" filter="url(#shadow)">
    <rect x="0" y="0" width="584" height="720" rx="42" fill="#090b0e" stroke="#727b7f" stroke-width="3"/>
    <rect x="22" y="24" width="540" height="672" rx="28" fill="url(#phone)"/>
