<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="wear" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="m"/>
      <feComponentTransfer in="m" result="f">
        <feFuncA type="table" tableValues="0 0.07"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="f" mode="multiply"/>
    </filter>
    <linearGradient id="store" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2420"/>
      <stop offset="0.5" stop-color="#0c100f"/>
      <stop offset="1" stop-color="#241c16"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a312c"/>
      <stop offset="1" stop-color="#141916"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8d0b8"/>
      <stop offset="1" stop-color="#a8b29a"/>
    </linearGradient>
    <linearGradient id="thermal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2ecda"/>
      <stop offset="1" stop-color="#d9d0b4"/>
    </linearGradient>
    <linearGradient id="scanner" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3a31" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff3a31" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff3a31" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#store)"/>
  <g opacity="0.12" fill="#d5cfb4">
    <rect x="40" y="80" width="180" height="720" rx="4"/>
    <rect x="1380" y="120" width="160" height="640" rx="4"/>
    <rect x="260" y="40" width="1080" height="28"/>
  </g>
  <path d="M0 820 L1600 780 L1600 900 L0 900 Z" fill="#070908" opacity="0.65"/>

  <!-- Cheap POS terminal housing -->
  <g filter="url(#shadow)">
    <rect x="86" y="58" width="978" height="784" rx="10" fill="url(#bezel)" stroke="#6d7568" stroke-width="2"/>
    <rect x="86" y="58" width="978" height="784" rx="10" fill="url(#bezel)" filter="url(#wear)" opacity="0.35"/>
    <!-- scuffs / grease -->
    <path d="M110 120 C180 100 240 150 300 118" fill="none" stroke="#000" stroke-opacity="0.18" stroke-width="6"/>
    <ellipse cx="920" cy="760" rx="70" ry="18" fill="#000" opacity="0.2"/>
    <rect x="108" y="88" width="934" height="56" fill="#0e1210"/>
    <text x="128" y="124" font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#c9d2b8">惠万家 POS-07</text>
    <text x="1018" y="124" text-anchor="end" font-family="Courier New, monospace" font-size="20" font-weight="700" fill="#e8d4a0">SHIFT 日班</text>

    <!-- monochrome LCD panel -->
    <rect x="108" y="156" width="934" height="560" fill="#1a2018" stroke="#3a4238" stroke-width="3"/>
    <rect x="120" y="168" width="910" height="536" fill="url(#lcd)" filter="url(#wear)"/>

    <!-- dense header -->
    <text x="138" y="198" font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#1a2218">收银练习 / 条码连扫</text>
    <text x="1010" y="198" text-anchor="end" font-family="Courier New, monospace" font-size="28" font-weight="900" fill="#5c1f18">01:00 / 40件</text>
    <line x1="138" y1="212" x2="1010" y2="212" stroke="#2a3228" stroke-width="1"/>

    <!-- column headers -->
    <g font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#2f3830">
      <text x="142" y="238">#</text>
      <text x="178" y="238">品名</text>
      <text x="430" y="238">条码</text>
      <text x="620" y="238">数量</text>
      <text x="700" y="238">单价</text>
      <text x="800" y="238">小计</text>
      <text x="920" y="238">状态</text>
    </g>
    <line x1="138" y1="248" x2="1010" y2="248" stroke="#2a3228" stroke-width="1"/>

    <!-- dense filler queue rows (noise labour) -->
    <g font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#2a3228" opacity="0.55">
      <text x="142" y="272">01  袋装瓜子  690123450001  x2  3.50  7.00  OK</text>
      <text x="142" y="294">02  矿泉水500 690123450014  x1  1.50  1.50  OK</text>
      <text x="142" y="316">03  烟花爆竹  --------ERR--  x1  ----  ----  拒扫</text>
      <text x="142" y="338">04  酱油陈酿  690123450088  x1  8.90  8.90  OK</text>
    </g>

    <!-- three authored practice items as dense rows -->
    <g font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif">
      <rect x="134" y="352" width="882" height="44" fill="#b8c2a6"/>
      <text x="142" y="380" font-size="18" font-weight="800" fill="#141a14">05  临期辣条    690040317021  x1  2.50  2.50  已扫 嘀</text>

      <rect x="134" y="400" width="882" height="44" fill="#c2cbb0"/>
      <text x="142" y="428" font-size="18" font-weight="800" fill="#141a14">06  冰红茶      690040317055  x1  3.00  3.00  已扫 嘀</text>

      <rect x="134" y="448" width="882" height="44" fill="#b8c2a6"/>
      <text x="142" y="476" font-size="18" font-weight="800" fill="#141a14">07  桶装方便面  690040317089  x1  4.50  4.50  已扫 嘀</text>
    </g>

    <!-- more cramped queue + interruptions -->
    <g font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#2a3228" opacity="0.55">
      <text x="142" y="516">08  纸巾抽装  690123450201  x3  6.00 18.00  OK</text>
      <text x="142" y="538">09  !扫枪中断  请重贴条码   ---  ----  ----  HOLD</text>
      <text x="142" y="560">10  鸡蛋托盘  690123450233  x1 12.80 12.80  OK</text>
      <text x="142" y="582">11  袋装面包  条码磨损-----  x1  4.20  ----  重扫</text>
      <text x="142" y="604">12  可乐听装  690123450301  x2  2.80  5.60  OK</text>
      <text x="142" y="626">13  火腿肠    690123450318  x5  1.20  6.00  OK</text>
      <text x="142" y="648">14  垃圾袋    690123450340  x1  5.50  5.50  OK</text>
    </g>

    <line x1="138" y1="662" x2="1010" y2="662" stroke="#2a3228" stroke-width="1"/>
    <text x="142" y="688" font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#1a2218">合计 14行 / 练习锚点 3 / 拒扫1 / 重扫1</text>
    <text x="1010" y="688" text-anchor="end" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#5c1f18">目标 40件</text>

    <!-- sticky keys row -->
    <g font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">
      <rect x="120" y="740" width="140" height="68" rx="4" fill="#3a4238" stroke="#5a6258"/>
      <text x="190" y="782" text-anchor="middle" fill="#c9d2b8">F1 重扫</text>
      <rect x="276" y="740" width="140" height="68" rx="4" fill="#3a4238" stroke="#5a6258"/>
      <text x="346" y="782" text-anchor="middle" fill="#c9d2b8">F2 作废</text>
      <rect x="432" y="740" width="140" height="68" rx="4" fill="#3a4238" stroke="#5a6258"/>
      <text x="502" y="782" text-anchor="middle" fill="#c9d2b8">F3 挂单</text>
      <rect x="588" y="740" width="200" height="68" rx="4" fill="#4a2a24" stroke="#8a4a40"/>
      <text x="688" y="782" text-anchor="middle" fill="#f0d8c8">ENTER 确认</text>
      <rect x="804" y="740" width="218" height="68" rx="4" fill="#2a3228" stroke="#5a6258"/>
      <text x="913" y="770" text-anchor="middle" fill="#a8b29a" font-size="13">SCANNER</text>
      <text x="913" y="792" text-anchor="middle" fill="#e8d4a0" font-size="16">嘀 嘀 嘀</text>
    </g>
  </g>

  <!-- thermal receipt roll / barcode strip on the side -->
  <g filter="url(#shadow)" transform="translate(1100 90)">
    <rect x="0" y="0" width="420" height="700" rx="6" fill="#2a2620" stroke="#6a6254"/>
    <rect x="18" y="22" width="384" height="656" fill="url(#thermal)" filter="url(#wear)"/>
    <!-- torn top -->
    <path d="M18 22 L40 30 L62 18 L84 28 L106 16 L128 30 L150 18 L172 28 L194 16 L216 30 L238 18 L260 28 L282 16 L304 30 L326 18 L348 28 L366 16 L402 28 L402 48 L18 48 Z" fill="#2a2620"/>
    <text x="210" y="78" text-anchor="middle" font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="800" fill="#1a1812">惠万家 · 当班条码带</text>
    <text x="210" y="104" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#3a3830">热敏纸 · 褪色 · 胶粘</text>
    <line x1="42" y1="118" x2="378" y2="118" stroke="#3a3830" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- barcode blocks with wear -->
    <g fill="#16140f">
      <rect x="48" y="140" width="7" height="110"/><rect x="60" y="140" width="3" height="110"/><rect x="68" y="140" width="10" height="110"/>
      <rect x="84" y="140" width="4" height="110"/><rect x="94" y="140" width="12" height="110"/><rect x="112" y="140" width="3" height="110"/>
      <rect x="122" y="140" width="8" height="110"/><rect x="136" y="140" width="3" height="110"/><rect x="146" y="140" width="14" height="110"/>
      <rect x="168" y="140" width="5" height="110"/><rect x="180" y="140" width="3" height="110"/><rect x="190" y="140" width="11" height="110"/>
      <rect x="208" y="140" width="6" height="110"/><rect x="220" y="140" width="13" height="110"/><rect x="240" y="140" width="3" height="110"/>
      <rect x="250" y="140" width="8" height="110"/><rect x="264" y="140" width="3" height="110"/><rect x="274" y="140" width="15" height="110"/>
      <rect x="296" y="140" width="5" height="110"/><rect x="308" y="140" width="10" height="110"/><rect x="326" y="140" width="3" height="110"/>
      <rect x="336" y="140" width="12" height="110"/><rect x="354" y="140" width="4" height="110"/>
    </g>
    <rect x="30" y="188" width="360" height="6" fill="url(#scanner)"/>
    <text x="210" y="278" text-anchor="middle" font-family="Courier New, monospace" font-size="15" letter-spacing="2" fill="#1a1812">6 9 0 0 4 0 3 1 7 0 2 1</text>

    <g font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" fill="#1a1812">
      <text x="48" y="320">05 临期辣条     *1  2.50</text>
      <text x="48" y="348">06 冰红茶       *1  3.00</text>
      <text x="48" y="376">07 桶装方便面   *1  4.50</text>
      <line x1="48" y1="396" x2="372" y2="396" stroke="#3a3830" stroke-width="1"/>
      <text x="48" y="424" opacity="0.55">08 纸巾抽装     *3 18.00</text>
      <text x="48" y="452" opacity="0.55">09 扫枪中断     --- ----</text>
      <text x="48" y="480" opacity="0.55">10 鸡蛋托盘     *1 12.80</text>
      <text x="48" y="508" opacity="0.55">11 袋装面包重扫 --- ----</text>
    </g>

    <rect x="48" y="540" width="324" height="90" fill="none" stroke="#3a3830" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="210" y="578" text-anchor="middle" font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="700" fill="#3a2018">纸卷卡纸 / 请拉直</text>
    <text x="210" y="608" text-anchor="middle" font-family="Courier New, monospace, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#3a3830">货堆着 别玩系统</text>

    <!-- coffee ring / grease -->
    <circle cx="320" cy="640" r="36" fill="none" stroke="#6a5030" stroke-opacity="0.35" stroke-width="8"/>
    <text x="210" y="660" text-anchor="middle" font-family="Courier New, monospace" font-size="13" fill="#5a5240">CUT ——</text>
  </g>

  <text x="88" y="870" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" letter-spacing="2" fill="#ffffff" opacity="0.38">PROP / BARCODE SHIFT / CANDIDATE</text>
</svg>
