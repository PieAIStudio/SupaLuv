    <path d="M453 670 C735 686 917 642 1154 664" fill="none" stroke="#244b73" stroke-width="3" opacity="0.72"/>

    <text x="423" y="733" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" letter-spacing="2" fill="#6d675b">代收人签字</text>
    <path d="M618 732 C684 689 728 774 778 720 C810 687 854 751 897 713" fill="none" stroke="#244b73" stroke-width="5" stroke-linecap="round"/>
    <text x="1150" y="733" text-anchor="end" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="18" fill="#6d675b">字迹像医院处方</text>

    <g transform="translate(1053 532) rotate(-14)" opacity="0.62" fill="#6b6a60">
      <ellipse cx="44" cy="56" rx="24" ry="31"/>
      <ellipse cx="14" cy="20" rx="12" ry="17"/>
      <ellipse cx="40" cy="10" rx="12" ry="17"/>
      <ellipse cx="68" cy="18" rx="12" ry="17"/>
      <ellipse cx="86" cy="40" rx="12" ry="17"/>
    </g>
