  <g transform="translate(124 660) rotate(-8)" opacity="0.7">
    <rect x="0" y="0" width="196" height="92" rx="7" fill="#e8ddbd"/>
    <text x="98" y="39" text-anchor="middle" font-family="KaiTi, STKaiti, serif" font-size="24" font-weight="700" fill="#244b73">其余选择信任</text>
    <text x="98" y="69" text-anchor="middle" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" fill="#5c574d">只认出“九百”</text>
  </g>
  <text x="88" y="856" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" letter-spacing="2" fill="#ffffff" opacity="0.38">PROP / RENTAL RECEIPT / CANDIDATE</text>
