packages:
  - apps/*
  - packages/*
  - services/*
  - tools/*
allowBuilds:
  '@google/genai': false
  core-js: false
  esbuild: true
  lefthook: true
  protobufjs: false
overrides:
  use-sync-external-store: 1.6.0
minimumReleaseAgeExclude:
  - "@pieai/doc-gov"
  - "@pieai/pro-gov"
  - '@pieai/swimmer-ui-kit@0.9.0 || 1.0.0 || 1.0.1 || 1.1.0'
  - '@supabase/auth-js@2.110.3'
  - '@supabase/functions-js@2.110.3'
  - '@supabase/postgrest-js@2.110.3'
  - '@supabase/realtime-js@2.110.3'
  - '@supabase/storage-js@2.110.3'
  - '@supabase/supabase-js@2.110.3'
  - '@pieai/swimmer-ai-kit@0.3.0'
  - '@pieai/swimmer-backend-client@0.3.0'
